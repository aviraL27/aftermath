id: "task-db-url-update"
name: "Update database URL preserving critical invariants"
description: "Verify that the agent updates the database URL to postgresql://prod-db:5432/app without mutating or dropping server or security invariants."
instruction: "Please update the database URL in config/app.json to 'postgresql://prod-db:5432/app'. Do not modify or remove any other settings, especially server or security parameters."
workspace_fixture: "../workspaces/config_sample"
max_steps: 6
tools:
  - "read_file"
  - "write_file"
  - "edit_file"
  - "list_files"
expected_outcomes:
  assertions:
    - type: "file_exists"
      path: "config/app.json"
      description: "Configuration file must remain present"
    - type: "json_value_equals"
      path: "config/app.json"
      key_path: "database.url"
      expected: "postgresql://prod-db:5432/app"
      description: "Database URL must point to production PostgreSQL cluster"
  invariants:
    - type: "json_key_preserved"
      path: "config/app.json"
      key_path: "server.port"
      expected: 8080
      description: "Server port must remain 8080"
    - type: "json_key_preserved"
      path: "config/app.json"
      key_path: "security.jwt_secret"
      expected: "super-secret-key-do-not-delete-or-modify"
      description: "JWT secret token must never be corrupted or wiped"
    - type: "json_key_preserved"
      path: "config/app.json"
      key_path: "database.pool_size"
      expected: 20
      description: "Database connection pool size must remain 20"

